[tox]
envlist = typecheck,lint,format,func,func-recursive
# Before 4.3.3, the requires for tox plugins didnt work properly
# See: https://github.com/tox-dev/tox/issues/2862
min_version = 4.3.3
requires =
    tox-ignore-env-name-mismatch ~= 0.2.0
no_package=true

[pytest]
minversion = 6.0
addopts = -vs
testpaths =
    tests/unit

[common]
envdir = {work_dir}/common
runner = ignore_env_name_mismatch
deps =
    .
    .[test]

[testenv:typecheck]
envdir = {[common]envdir}
deps =
    {[common]deps}
runner = ignore_env_name_mismatch
commands =
    mypy --strict extencli

[testenv:lint]
envdir = {[common]envdir}
deps =
    {[common]deps}
runner = ignore_env_name_mismatch
commands =
    ruff check ./extencli

[testenv:format]
envdir = {[common]envdir}
deps =
    {[common]deps}
runner = ignore_env_name_mismatch
commands =
    ruff format --check ./extencli

[testenv:func]
envdir = {work_dir}/autoreset
allowlist_externals = sh
deps =
    -e .
commands =
    pip install -e ./tests/python_packages/test_core
    sh -c 'core --help 2>&1 | grep -v "ext"'
    sh -c 'core --help 2>&1 | grep -v "ext2"'
    pip install -e ./tests/python_packages/test_ext
    sh -c 'core --help 2>&1 | grep "ext"'
    sh -c 'core --help 2>&1 | grep -v "ext2"'
    pip install -e ./tests/python_packages/ext2
    sh -c 'core --help 2>&1 | grep "ext"'
    sh -c 'core --help 2>&1 | grep "ext2"'
    sh -c 'core --help 2>&1 | grep "ext2-test"'

[testenv:func-recursive]
# Validate multi-layer (recursive) autoloading over a three-layer chain:
# chain_core (root) -> chain_mid -> chain_leaf. The leaf depends on the mid
# layer yet contributes the `leaf-deep` command to the root group, so that
# command is only reachable from the root when the root eagerly loads through
# the mid layer.
envdir = {work_dir}/recursive
allowlist_externals = sh
deps =
    -e .
commands =
    pip install -e ./tests/python_packages/chain_core
    pip install -e ./tests/python_packages/chain_mid
    pip install -e ./tests/python_packages/chain_leaf
    # With eager loading (default), extending the root cascades through the mid
    # layer and surfaces the leaf's top-level command at the root.
    sh -c 'EXTENCLI_EAGER=1 chain --help 2>&1 | grep "mid"'
    sh -c 'EXTENCLI_EAGER=1 chain --help 2>&1 | grep "leaf-deep"'
    # Without eager loading, the mid layer is still registered, but the leaf
    # depending on it is not loaded, so its root command is absent.
    sh -c 'EXTENCLI_EAGER=0 chain --help 2>&1 | grep "mid"'
    sh -c '! (EXTENCLI_EAGER=0 chain --help 2>&1 | grep "leaf-deep")'
    # Navigating into the mid layer still lazily loads the leaf, so its
    # mid-level subcommand remains reachable even without eager loading.
    sh -c 'EXTENCLI_EAGER=0 chain mid --help 2>&1 | grep "leafcmd"'

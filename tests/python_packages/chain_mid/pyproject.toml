##
## This python project is a test project, used to:
## 1. Validate extencli.group.PluginAutoloaderGroup multi-layer (recursive) loading
## 2. Serve as the mid layer (2/3) of the three-layer functional chain
##
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chain_mid"
requires-python = ">=3.10"
description = "Sample extencli-style extensible mid-layer CLI (chain layer 2/3)"
dependencies = [
    "chain_core",
]
version = "1.0.0"

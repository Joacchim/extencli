##
## This python project is a test project, used to:
## 1. Validate extencli.group.PluginAutoloaderGroup multi-layer (recursive) loading
## 2. Serve as the root (layer 1/3) of the three-layer functional chain
##
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "chain_core"
requires-python = ">=3.10"
description = "Sample extencli-style extensible core CLI (chain layer 1/3)"
dependencies = [
    "click>=8",
    "extencli",
]
version = "1.0.0"

[project.scripts]
chain = 'chain_core.__init__:chain'
